[workspace]
resolver = "2"
members = [
  "crates/neuestar-elf",
  "crates/neuestar-h0-check",
  "crates/neuestar-h0-probe",
  "crates/neuestar-host-inspect",
  "crates/neuestar-probe-app",
  "crates/neuestar-probe-launcher",
  "crates/neuestar-report",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/neuestar/neuestar"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
goblin = "0.10"
hex = "0.4"
jsonschema = "0.26"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

