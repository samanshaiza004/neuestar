name: Gate L0 driver churn cell

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Operator-controlled observation phase; CI never changes the driver
        required: true
        type: choice
        options: [baseline, post-driver-change]
      distro:
        description: Target distribution label
        required: true
        type: choice
        options: [fedora, ubuntu, arch, nixos]
      gpu:
        description: Target GPU vendor label
        required: true
        type: choice
        options: [intel, amd, nvidia]
      display:
        description: Target display protocol label
        required: true
        type: choice
        options: [wayland, x11]
      machine:
        description: Unique self-hosted runner label suffix; both phases must use the same value
        required: true
        type: string
      expected_machine_identity_sha256:
        description: Blank for baseline; required post-change and copied from baseline churn-identity.txt
        required: false
        type: string
      artifact_url_or_run_id:
        description: HTTPS URL for the direct canonical archive, or a GitHub Actions run ID containing canonical-artifact
        required: true
        type: string
      expected_archive_sha:
        description: Expected 64-character SHA-256 of the canonical archive
        required: true
        type: string

# Churn is deliberately two manual observations on the same physical machine.
# Between phases an operator uses the distribution's supported driver mechanism;
# this workflow never installs, upgrades, or changes a driver automatically.
permissions:
  contents: read
  actions: read

jobs:
  churn:
    name: L0 churn ${{ inputs.phase }} / ${{ inputs.distro }} / ${{ inputs.gpu }} / ${{ inputs.display }}
    runs-on: ${{ fromJSON(format('["self-hosted","linux","x64","distro-{0}","gpu-{1}","display-{2}","machine-{3}"]', inputs.distro, inputs.gpu, inputs.display, inputs.machine)) }}
    timeout-minutes: 30
    env:
      ARTIFACT_REF: ${{ inputs.artifact_url_or_run_id }}
      EXPECTED_ARCHIVE_SHA: ${{ inputs.expected_archive_sha }}
      CHURN_PHASE: ${{ inputs.phase }}
      MACHINE_LABEL_SUFFIX: ${{ inputs.machine }}
      EXPECTED_MACHINE_IDENTITY: ${{ inputs.expected_machine_identity_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out runner-side scripts
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download, verify, and observe without changing drivers
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/neuestar-churn-evidence"
          download_dir="$RUNNER_TEMP/neuestar-churn-download"
          root_dir="$RUNNER_TEMP/neuestar-churn-root"
          mkdir -p "$evidence_dir" "$download_dir" "$root_dir"

          if [[ $(id -u) -eq 0 ]]; then
            echo 'physical Gate L0 must run as an ordinary non-root user' > "$evidence_dir/stderr.log"
            exit 77
          fi
          if [[ ! -r /etc/machine-id ]]; then
            echo 'a readable stable machine identity is required for churn continuity' > "$evidence_dir/stderr.log"
            exit 77
          fi
          machine_identity_sha256="$({ printf 'neuestar-churn-v1:'; tr -d '\n' < /etc/machine-id; } | sha256sum | cut -d ' ' -f 1)"
          if [[ "$CHURN_PHASE" == post-driver-change ]]; then
            if ! [[ "$EXPECTED_MACHINE_IDENTITY" =~ ^[0-9a-f]{64}$ ]] || \
              [[ "$EXPECTED_MACHINE_IDENTITY" != "$machine_identity_sha256" ]]; then
              echo 'post-driver-change run is not on the recorded baseline machine' > "$evidence_dir/stderr.log"
              exit 77
            fi
          fi
          {
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'machine_label=machine-%s\n' "$MACHINE_LABEL_SUFFIX"
            printf 'machine_identity_sha256=%s\n' "$machine_identity_sha256"
          } > "$evidence_dir/churn-identity.txt"

          if ! [[ "$EXPECTED_ARCHIVE_SHA" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo 'expected_archive_sha must be exactly 64 hexadecimal characters' >&2
            exit 2
          fi
          if [[ "$ARTIFACT_REF" =~ ^[0-9]+$ ]]; then
            gh run download "$ARTIFACT_REF" \
              --repo "$GITHUB_REPOSITORY" \
              --name canonical-artifact \
              --dir "$download_dir"
          elif [[ "$ARTIFACT_REF" == https://* ]]; then
            curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$download_dir/direct-archive" "$ARTIFACT_REF"
          else
            echo 'artifact_url_or_run_id must be a numeric run ID or an HTTPS URL' >&2
            exit 2
          fi

          archive_path=''
          while IFS= read -r -d '' candidate; do
            case "$candidate" in
              *.sha256|*/SHA256SUMS|*/artifact.json) continue ;;
            esac
            actual_sha="$(sha256sum "$candidate" | cut -d ' ' -f 1)"
            if [[ "$actual_sha" == "${EXPECTED_ARCHIVE_SHA,,}" ]]; then
              archive_path="$candidate"
              break
            fi
          done < <(find "$download_dir" -type f -print0)
          if [[ -z "$archive_path" ]]; then
            echo 'no downloaded file matched expected_archive_sha; refusing extraction' >&2
            exit 3
          fi
          printf '%s  %s\n' "${EXPECTED_ARCHIVE_SHA,,}" "$archive_path" > "$evidence_dir/archive.sha256"
          test -x scripts/verify-artifact.sh
          scripts/verify-artifact.sh "$archive_path" "${EXPECTED_ARCHIVE_SHA,,}" > "$evidence_dir/artifact-verification.log"

          if tar --zstd -tf "$archive_path" >/dev/null 2>&1; then
            tar --zstd -xf "$archive_path" -C "$root_dir"
          elif tar -tzf "$archive_path" >/dev/null 2>&1; then
            tar -xzf "$archive_path" -C "$root_dir"
          elif tar -tf "$archive_path" >/dev/null 2>&1; then
            tar -xf "$archive_path" -C "$root_dir"
          else
            echo 'verified file is not a supported tar archive' >&2
            exit 4
          fi

          find "$download_dir" -type f \( -name artifact.json -o -name SHA256SUMS \) \
            -exec cp --no-clobber '{}' "$evidence_dir/" \; || true
          artifact_manifest="$(find "$root_dir" -type f -name artifact.json -print -quit || true)"
          if [[ -n "$artifact_manifest" ]]; then cp "$artifact_manifest" "$evidence_dir/artifact.json"; fi
          runtime_manifest="$(find "$root_dir" -type f -name rootfs.SHA256SUMS -print -quit || true)"
          if [[ -n "$runtime_manifest" ]]; then cp "$runtime_manifest" "$evidence_dir/rootfs.SHA256SUMS"; fi
          capture_plan="$(find "$root_dir" -type f -name capture-plan.json -print -quit || true)"
          if [[ -n "$capture_plan" ]]; then cp "$capture_plan" "$evidence_dir/capture-plan.json"; fi

          {
            printf 'phase=%s\n' "$CHURN_PHASE"
            date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
            uname -a
            id
            if [[ -r /etc/os-release ]]; then cat /etc/os-release; fi
            if command -v lspci >/dev/null 2>&1; then lspci -nn; fi
          } > "$evidence_dir/host-metadata.txt" 2>&1 || true
          {
            echo "churn phase: $CHURN_PHASE"
            if command -v vulkaninfo >/dev/null 2>&1; then vulkaninfo --summary; fi
            if command -v ldconfig >/dev/null 2>&1; then ldconfig -p; fi
          } > "$evidence_dir/vulkan-loader-diagnostics.log" 2>&1 || true

          probe="${root_dir}/bin/neuestar-probe"
          if [[ ! -x "$probe" ]]; then
            probe="$(find "$root_dir" -type f -name neuestar-probe -perm -u+x -print -quit || true)"
          fi
          run_status=126
          if [[ -n "$probe" && -x "$probe" ]]; then
            set +e
            (
              cd "$evidence_dir"
              "$probe" \
                --archive-sha256 "${EXPECTED_ARCHIVE_SHA,,}" \
                --distro "${{ inputs.distro }}" \
                --gpu "${{ inputs.gpu }}" \
                --display "${{ inputs.display }}" \
                --report report.json \
                > stdout.log 2> stderr.log
              probe_status=$?
              exit "$probe_status"
            )
            run_status=$?
            set -e
          else
            echo 'canonical artifact did not contain executable bin/neuestar-probe' > "$evidence_dir/stderr.log"
            : > "$evidence_dir/stdout.log"
          fi
          printf 'phase=%s\nprobe_exit_status=%s\n' "$CHURN_PHASE" "$run_status" > "$evidence_dir/exit-status.txt"
          exit "$run_status"
      - name: Upload churn evidence
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l0-churn-evidence-${{ github.run_id }}-${{ inputs.phase }}-${{ inputs.distro }}-${{ inputs.gpu }}-${{ inputs.display }}
          path: |
            ${{ runner.temp }}/neuestar-churn-evidence/report.json
            ${{ runner.temp }}/neuestar-churn-evidence/stdout.log
            ${{ runner.temp }}/neuestar-churn-evidence/stderr.log
            ${{ runner.temp }}/neuestar-churn-evidence/capture-plan.json
            ${{ runner.temp }}/neuestar-churn-evidence/vulkan-loader-diagnostics.log
            ${{ runner.temp }}/neuestar-churn-evidence/host-metadata.txt
            ${{ runner.temp }}/neuestar-churn-evidence/host-metadata.json
            ${{ runner.temp }}/neuestar-churn-evidence/child-result.json
            ${{ runner.temp }}/neuestar-churn-evidence/archive.sha256
            ${{ runner.temp }}/neuestar-churn-evidence/artifact-verification.log
            ${{ runner.temp }}/neuestar-churn-evidence/SHA256SUMS
            ${{ runner.temp }}/neuestar-churn-evidence/rootfs.SHA256SUMS
            ${{ runner.temp }}/neuestar-churn-evidence/artifact.json
            ${{ runner.temp }}/neuestar-churn-evidence/exit-status.txt
            ${{ runner.temp }}/neuestar-churn-evidence/churn-identity.txt
          if-no-files-found: warn
